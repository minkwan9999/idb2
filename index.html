<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>널링 불량선별 및 구간 측정 웹앱</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        
        /* 카메라 / 비디오 영역 */
        #viewport { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #video { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        
        /* 오버레이 캔버스 (파란색 가이드 + 빨간색 측정선) */
        #overlay-canvas { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
        
        /* 상단 정보 패널 */
        #header-panel { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 20; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 8px; backdrop-filter: blur(5px); }
        .spec-info span { font-size: 12px; color: #aaa; display: block; }
        .spec-info strong { font-size: 15px; color: #fff; }
        
        /* 판정 결과 배지 */
        #status-badge { padding: 8px 14px; font-size: 16px; font-weight: bold; border-radius: 6px; background: #555; color: #fff; transition: 0.2s; }
        #status-badge.ok { background: #27ae60; box-shadow: 0 0 12px rgba(39, 174, 96, 0.6); }
        #status-badge.ng { background: #c0392b; box-shadow: 0 0 12px rgba(192, 57, 43, 0.6); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.6; } }

        /* 하단 컨트롤 패널 */
        #control-panel { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 20; background: rgba(20,20,20,0.85); padding: 15px; display: flex; gap: 10px; justify-content: center; align-items: center; backdrop-filter: blur(10px); }
        .btn { flex: 1; padding: 12px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn-capture { background: #e74c3c; color: white; }
        .btn-capture:active { background: #c0392b; }
        .btn-settings { background: #7f8c8d; color: white; max-width: 80px; }

        /* 설정 모달 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 100; justify-content: center; align-items: center; }
        .modal-card { background: #2c3e50; padding: 20px; border-radius: 12px; width: 85%; max-width: 330px; }
        .modal-card h3 { margin-top: 0; color: #ecf0f1; }
        .modal-card label { display: block; margin: 10px 0 5px; font-size: 13px; color: #bdc3c7; }
        .modal-card input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #7f8c8d; background: #34495e; color: white; font-size: 15px; }
        .modal-card button { width: 100%; margin-top: 15px; background: #27ae60; color: white; padding: 10px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <!-- 상단 대시보드 -->
    <div id="header-panel">
        <div class="spec-info">
            <span>빨간색 구간 기준치</span>
            <strong id="target-display">0.85 mm</strong>
        </div>
        <div id="status-badge">대기 중</div>
    </div>

    <!-- 카메라 뷰 및 그래픽 오버레이 -->
    <div id="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay-canvas"></canvas>
    </div>

    <!-- 하단 제어 버튼 -->
    <div id="control-panel">
        <button class="btn btn-settings" onclick="openSettings()">설정</button>
        <button class="btn btn-capture" onclick="measureRedSegment()">빨간색 구간 측정/판정</button>
    </div>

    <!-- 설정 모달 -->
    <div id="modal">
        <div class="modal-card">
            <h3>측정 규격 설정</h3>
            <label>빨간색 구간 목표 길이 (mm)</label>
            <input type="number" id="input-target" value="0.85" step="0.01">
            <label>허용 공차 범위 (±mm)</label>
            <input type="number" id="input-tolerance" value="0.05" step="0.01">
            <button onclick="closeSettings()">적용 및 저장</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('overlay-canvas');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('status-badge');

    let targetLength = 0.85; // mm
    let tolerance = 0.05;    // mm

    // 화면 크기에 맞춰 캔버스 해상도 조절
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        drawGuides();
    }
    window.addEventListener('resize', resizeCanvas);

    // 가이드라인 및 빨간색 측정 바 그리기
    function drawGuides() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const cx = canvas.width / 2;
        const cy = canvas.height / 2;

        // 1. 파란색 프로파일 경계선 (참조용)
        ctx.strokeStyle = '#00d2ff';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(cx - 120, cy - 40);
        ctx.lineTo(cx - 40, cy + 40);
        ctx.lineTo(cx, cy);
        ctx.lineTo(cx + 40, cy + 40);
        ctx.lineTo(cx + 120, cy - 40);
        ctx.stroke();

        // 2. 빨간색 구간 측정선 (상단 수평선, 하단 수평선, 화살표)
        const lineY1 = cy + 10;
        const lineY2 = cy + 35;

        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 2;

        // 상단 수평선
        ctx.beginPath();
        ctx.moveTo(cx - 50, lineY1);
        ctx.lineTo(cx - 10, lineY1);
        ctx.stroke();

        // 하단 수평선
        ctx.beginPath();
        ctx.moveTo(cx - 50, lineY2);
        ctx.lineTo(cx - 10, lineY2);
        ctx.stroke();

        // 수직 화살표 연결선
        ctx.beginPath();
        ctx.moveTo(cx - 30, lineY1);
        ctx.lineTo(cx - 30, lineY2);
        ctx.stroke();

        // 텍스트 안내
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 14px sans-serif';
        ctx.fillText("빨간색 측정 구간", cx - 110, lineY1 + 15);
    }

    // 카메라 구동
    async function initCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: "environment" } },
                audio: false
            });
            video.srcObject = stream;
        } catch (err) {
            try {
                const fallbackStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = fallbackStream;
            } catch (e) {
                console.warn("카메라를 실행할 수 없습니다. (HTTPS 환경 확인 필요)");
            }
        }
        resizeCanvas();
    }

    // 빨간색 구간 측정 및 OK/NG 판정 실행
    function measureRedSegment() {
        statusBadge.innerText = "측정 중...";
        statusBadge.className = "";

        setTimeout(() => {
            // 현장 시뮬레이션 오차 반영 (실제 현장 연동 시 픽셀 거리 계산식 대입)
            const simulatedVal = parseFloat((targetLength + (Math.random() - 0.45) * 0.08).toFixed(2));
            const diff = Math.abs(simulatedVal - targetLength);

            if (diff <= tolerance) {
                statusBadge.innerText = `OK (${simulatedVal}mm)`;
                statusBadge.className = "ok";
            } else {
                statusBadge.innerText = `NG (${simulatedVal}mm)`;
                statusBadge.className = "ng";
            }
        }, 300);
    }

    function openSettings() { document.getElementById('modal').style.display = 'flex'; }
    function closeSettings() {
        targetLength = parseFloat(document.getElementById('input-target').value);
        tolerance = parseFloat(document.getElementById('input-tolerance').value);
        document.getElementById('target-display').innerText = targetLength + " mm";
        document.getElementById('modal').style.display = 'none';
    }

    initCamera();
</script>
</body>
</html>
