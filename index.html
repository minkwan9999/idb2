<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>널링 비전 측정 모바일 앱</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: 100dvh; position: relative; }
        
        /* 상단 상태 바 */
        #header-panel { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.85); padding: 12px 15px; z-index: 20; border-bottom: 1px solid #333; }
        .spec-info span { font-size: 11px; color: #aaa; display: block; }
        .spec-info strong { font-size: 14px; color: #fff; }
        #status-badge { padding: 6px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; background: #2980b9; color: #fff; }
        #status-badge.ok { background: #27ae60; }
        #status-badge.ng { background: #c0392b; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* 카메라 및 캔버스 뷰포트 */
        #viewport { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #video, #vision-canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #vision-canvas { z-index: 5; image-rendering: -webkit-optimize-contrast; display: none; }

        /* 인터랙티브 측정 오버레이 레이어 */
        #overlay-container { position: absolute; width: 100%; height: 100%; z-index: 10; display: none; }

        /* 라인 렌더링 SVG */
        #lines-svg { position: absolute; width: 100%; height: 100%; pointer-events: none; z-index: 12; }

        /* 조절점 스타일 */
        .handle { position: absolute; width: 42px; height: 42px; border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 15; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 11px; font-weight: bold; box-shadow: 0 0 10px rgba(0,0,0,0.6); }
        
        .blue-handle { background: rgba(0, 210, 255, 0.85); color: #000; }
        .red-handle { background: rgba(231, 76, 60, 0.85); color: #fff; }

        #handle-b1 { top: 40%; left: 35%; }
        #handle-b2 { top: 40%; left: 65%; }
        #handle-b3 { top: 25%; left: 50%; }
        #handle-r1 { top: 65%; left: 42%; }
        #handle-r2 { top: 65%; left: 58%; }

        /* 우측 줌 컨트롤 (맥스 디폴트) */
        #zoom-control { position: absolute; right: 15px; top: 15px; z-index: 20; background: rgba(0,0,0,0.7); padding: 10px 5px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; }
        #zoom-control span { font-size: 10px; color: #00d2ff; margin-bottom: 5px; font-weight: bold; }
        #zoom-slider { writing-mode: vertical-lr; direction: rtl; height: 100px; width: 8px; accent-color: #00d2ff; }

        /* 하단 제어 버튼 및 앱 버전 표기 */
        #control-panel { flex: 0 0 auto; background: rgba(20,20,20,0.95); padding: 12px 15px; padding-bottom: max(12px, env(safe-area-inset-bottom)); z-index: 20; display: flex; flex-direction: column; gap: 8px; border-top: 1px solid #333; }
        .btn-row { display: flex; gap: 10px; width: 100%; justify-content: center; align-items: center; }
        .btn { flex: 1; padding: 14px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn-action { background: #2980b9; color: white; box-shadow: 0 4px 10px rgba(41, 128, 185,.4); }
        .btn-settings { background: #7f8c8d; color: white; max-width: 80px; }
        .app-version { font-size: 11px; color: #666; text-align: center; margin-top: 2px; }

        /* 설정 모달 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-card { background: #2c3e50; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; }
        .modal-card h3 { margin-top: 0; color: #ecf0f1; }
        .modal-card label { display: block; margin: 10px 0 5px; font-size: 13px; color: #bdc3c7; }
        .modal-card input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #7f8c8d; background: #34495e; color: white; font-size: 15px; }
        .modal-card button { width: 100%; margin-top: 15px; background: #27ae60; color: white; padding: 10px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <!-- 상단 안내 패널 -->
    <div id="header-panel">
        <div class="spec-info">
            <span>기준 규격 | 실시간 산 높이</span>
            <strong id="spec-display">2.98 mm | <span id="calc-height">0.00</span> mm</strong>
        </div>
        <div id="status-badge">대기 중</div>
    </div>

    <!-- 뷰포트 (카메라 영역) -->
    <div id="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="vision-canvas"></canvas>

        <!-- 캡처 후 활성화되는 조절 레이어 -->
        <div id="overlay-container">
            <svg id="lines-svg" xmlns="http://www.w3.org/2000/svg">
                <line id="line-blue-1" x1="0" y1="0" x2="0" y2="0" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
                <line id="line-blue-2" x1="0" y1="0" x2="0" y2="0" stroke="#00d2ff" stroke-width="5" stroke-linecap="round"/>
                <line id="line-red" x1="0" y1="0" x2="0" y2="0" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
            </svg>

            <!-- 5개의 개별 조절점 (b1, b2, b3 / r1, r2) -->
            <div id="handle-b1" class="handle blue-handle">B1</div>
            <div id="handle-b2" class="handle blue-handle">B2</div>
            <div id="handle-b3" class="handle blue-handle">B3</div>
            <div id="handle-r1" class="handle red-handle">R1</div>
            <div id="handle-r2" class="handle red-handle">R2</div>
        </div>

        <!-- 우측 줌 컨트롤 (맥스 디폴트) -->
        <div id="zoom-control">
            <span>ZOOM</span>
            <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="4" oninput="updateZoom(this.value)">
        </div>
    </div>

    <!-- 하단 제어 버튼 및 버전 표기 -->
    <div id="control-panel">
        <div class="btn-row">
            <button class="btn btn-settings" onclick="openSettings()">설정</button>
            <button class="btn btn-action" id="main-btn" onclick="processCaptureAndMeasurement()">캡처 및 포인트 조절</button>
        </div>
        <div class="app-version">v1.3.5 (Knurling Inspector)</div>
    </div>

    <!-- 설정 모달 -->
    <div id="modal">
        <div class="modal-card">
            <h3>측정 규격 설정</h3>
            <label>기준 규격 (mm)</label>
            <input type="number" id="input-target" value="2.98" step="0.01">
            <button onclick="closeSettings()">저장 및 적용</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('vision-canvas');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('status-badge');
    const zoomSlider = document.getElementById('zoom-slider');
    const mainBtn = document.getElementById('main-btn');
    const overlayContainer = document.getElementById('overlay-container');
    const calcHeightEl = document.getElementById('calc-height');
    
    const handleB1 = document.getElementById('handle-b1');
    const handleB2 = document.getElementById('handle-b2');
    const handleB3 = document.getElementById('handle-b3');
    const handleR1 = document.getElementById('handle-r1');
    const handleR2 = document.getElementById('handle-r2');
    
    const lineBlue1 = document.getElementById('line-blue-1');
    const lineBlue2 = document.getElementById('line-blue-2');
    const lineRed = document.getElementById('line-red');

    let targetLength = 2.98;
    const tolerance = 0.30;
    const referenceHeight = 0.25; // 기준 산 높이 (0.25mm)
    let videoStream = null;
    let isCaptured = false;
    let currentZoom = 4;

    let activeHandle = null;
    function setupHandleDrag(handle) {
        handle.addEventListener('pointerdown', (e) => {
            activeHandle = handle;
            e.stopPropagation();
        });
    }
    setupHandleDrag(handleB1);
    setupHandleDrag(handleB2);
    setupHandleDrag(handleB3);
    setupHandleDrag(handleR1);
    setupHandleDrag(handleR2);

    window.addEventListener('pointermove', (e) => {
        if (!activeHandle) return;
        activeHandle.style.left = `${e.clientX}px`;
        activeHandle.style.top = `${e.clientY}px`;
        updateAllLinesAndMeasurement();
    });
    window.addEventListener('pointerup', () => { activeHandle = null; });

    function updateAllLinesAndMeasurement() {
        const getCenter = (el) => {
            const r = el.getBoundingClientRect();
            return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
        };

        const b1 = getCenter(handleB1);
        const b2 = getCenter(handleB2);
        const b3 = getCenter(handleB3);

        lineBlue1.setAttribute('x1', b1.x);
        lineBlue1.setAttribute('y1', b1.y);
        lineBlue1.setAttribute('x2', b2.x);
        lineBlue1.setAttribute('y2', b2.y);

        // b1, b2 선분에서 b3로 내린 법선(높이) 계산 및 시각화용 선분 연결
        lineBlue2.setAttribute('x1', (b1.x + b2.x) / 2);
        lineBlue2.setAttribute('y1', (b1.y + b2.y) / 2);
        lineBlue2.setAttribute('x2', b3.x);
        lineBlue2.setAttribute('y2', b3.y);

        const r1 = getCenter(handleR1);
        const r2 = getCenter(handleR2);
        lineRed.setAttribute('x1', r1.x);
        lineRed.setAttribute('y1', r1.y);
        lineRed.setAttribute('x2', r2.x);
        lineRed.setAttribute('y2', r2.y);

        // b1-b2 선분과 b3 간의 수직 거리(법선 길이 px) 계산
        const A = b2.y - b1.y;
        const B = b1.x - b2.x;
        const C = (b2.x * b1.y) - (b1.x * b2.y);
        const normalHeightPx = Math.abs(A * b3.x + B * b3.y + C) / Math.sqrt(A * A + B * B);

        // 법선 높이를 실제 mm로 환산하여 상단 표기 (참조 높이 0.25mm 활용)
        const liveHeightMm = parseFloat(((normalHeightPx / currentZoom) * (referenceHeight / (normalHeightPx > 0 ? normalHeightPx : 1)) * (normalHeightPx / 100)).toFixed(3)) || 0.25;
        calcHeightEl.innerText = liveHeightMm;

        // 배율 산정: (B1-B2 선분에서 B3로 내린 법선 길이 px) / 0.25mm
        const scaleFactor = normalHeightPx > 0 ? normalHeightPx / referenceHeight : 1;

        // 빨간색 결육 픽셀 거리 계산
        const dx = r2.x - r1.x;
        const dy = r2.y - r1.y;
        const redPixelDistance = Math.sqrt(dx * dx + dy * dy);

        // 최종 실시간 결육 길이 = (빨간색 결육 픽셀 거리 / 줌 배율) * 배율
        const currentMeasuredVal = parseFloat((((redPixelDistance / currentZoom) / scaleFactor) * referenceHeight).toFixed(2));

        const diff = Math.abs(currentMeasuredVal - targetLength);
        if (isCaptured) {
            if (diff <= tolerance) {
                statusBadge.innerText = `OK (${currentMeasuredVal}mm)`;
                statusBadge.className = "ok";
            } else {
                statusBadge.innerText = `NG (${currentMeasuredVal}mm)`;
                statusBadge.className = "ng";
            }
        }
    }

    async function initCamera() {
        try {
            const constraints = { video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = videoStream;
        } catch (err) {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
                video.srcObject = videoStream;
            } catch (e) {
                alert("카메라 권한을 확인해주세요. (HTTPS 환경 필수)");
            }
        }
        zoomSlider.value = 4;
        updateZoom(4);
    }

    function updateZoom(val) {
        currentZoom = parseFloat(val);
        if (isCaptured) return;
        video.style.transform = `scale(${currentZoom})`;
    }

    function processCaptureAndMeasurement() {
        if (!isCaptured) {
            const vW = video.videoWidth || 1920;
            const vH = video.videoHeight || 1080;
            
            canvas.width = vW;
            canvas.height = vH;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            const cropW = vW / currentZoom;
            const cropH = vH / currentZoom;
            const cropX = (vW - cropW) / 2;
            const cropY = (vH - cropH) / 2;

            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, vW, vH);

            video.style.display = 'none';
            canvas.style.display = 'block';
            
            overlayContainer.style.display = 'block';
            
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            
            handleB1.style.left = `${cx - 60}px`; handleB1.style.top = `${cy + 30}px`;
            handleB2.style.left = `${cx + 60}px`; handleB2.style.top = `${cy + 30}px`;
            handleB3.style.left = `${cx}px`; handleB3.style.top = `${cy - 40}px`;
            handleR1.style.left = `${cx - 30}px`; handleR1.style.top = `${cy + 50}px`;
            handleR2.style.left = `${cx + 30}px`; handleR2.style.top = `${cy + 50}px`;
            
            updateAllLinesAndMeasurement();

            isCaptured = true;
            mainBtn.innerText = "측정 확정 (저장)";
            mainBtn.style.backgroundColor = "#27ae60";

        } else {
            overlayContainer.style.display = 'none';
            
            mainBtn.innerText = "재촬영 (RESET)";
            mainBtn.style.backgroundColor = "#e74c3c";
        }

        if (mainBtn.innerText.includes("재촬영")) {
            canvas.style.display = 'none';
            video.style.display = 'block';
            overlayContainer.style.display = 'none';
            
            isCaptured = false;
            mainBtn.innerText = "캡처 및 포인트 조절";
            mainBtn.style.backgroundColor = "#2980b9";
            statusBadge.innerText = "대기 중";
            statusBadge.className = "";
        }
    }

    function openSettings() { document.getElementById('modal').style.display = 'flex'; }
    function closeSettings() {
        targetLength = parseFloat(document.getElementById('input-target').value);
        document.getElementById('spec-display').innerHTML = `${targetLength.toFixed(2)} mm | <span id="calc-height">0.00</span> mm`;
        document.getElementById('modal').style.display = 'none';
    }

    initCamera();
</script>
</body>
</html>
