<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>널링 비전 측정 - Step 1: 프로파일 찾기</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body { margin: 0; padding: 0; background-color: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        #app { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        
        /* 카메라 및 캡처 뷰포트 */
        #viewport { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #video, #vision-canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #vision-canvas { z-index: 5; image-rendering: -webkit-optimize-contrast; display: none; }

        /* 상단 상태 바 */
        #header-panel { position: absolute; top: 15px; left: 15px; right: 15px; z-index: 20; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.8); padding: 10px 15px; border-radius: 8px; backdrop-filter: blur(5px); }
        .spec-info span { font-size: 11px; color: #aaa; display: block; }
        .spec-info strong { font-size: 14px; color: #fff; }
        
        #status-badge { padding: 8px 12px; font-size: 14px; font-weight: bold; border-radius: 6px; background: #2980b9; color: #fff; }

        /* 우측 줌 컨트롤 */
        #zoom-control { position: absolute; right: 15px; top: 90px; z-index: 20; background: rgba(0,0,0,0.7); padding: 10px 5px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; }
        #zoom-control span { font-size: 10px; color: #00d2ff; margin-bottom: 5px; font-weight: bold; }
        #zoom-slider { writing-mode: vertical-lr; direction: rtl; height: 110px; width: 8px; accent-color: #00d2ff; }

        /* 하단 제어 버튼 */
        #control-panel { position: absolute; bottom: 0; left: 0; width: 100%; z-index: 20; background: rgba(20,20,20,0.95); padding: 15px; display: flex; gap: 10px; justify-content: center; align-items: center; }
        .btn { flex: 1; padding: 14px; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn-action { background: #2980b9; color: white; }
    </style>
</head>
<body>

<div id="app">
    <!-- 상단 안내 패널 -->
    <div id="header-panel">
        <div class="spec-info">
            <span>현재 단계</span>
            <strong>Step 1: 프로파일(외곽) 추출</strong>
        </div>
        <div id="status-badge">대기 중 (정렬 후 캡처)</div>
    </div>

    <!-- 우측 줌 슬라이더 -->
    <div id="zoom-control">
        <span>ZOOM</span>
        <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1" oninput="updateZoom(this.value)">
    </div>

    <!-- 뷰포트 -->
    <div id="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="vision-canvas"></canvas>
    </div>

    <!-- 하단 제어 버튼 -->
    <div id="control-panel">
        <button class="btn btn-action" id="main-btn" onclick="captureAndFindProfile()">캡처 및 파란색 프로파일 추출</button>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('vision-canvas');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('status-badge');
    const zoomSlider = document.getElementById('zoom-slider');
    const mainBtn = document.getElementById('main-btn');

    let videoStream = null;
    let isCaptured = false;
    let currentZoom = 1;

    // 고해상도 카메라 구동
    async function initCamera() {
        try {
            const constraints = {
                video: {
                    facingMode: { exact: "environment" },
                    width: { ideal: 1920 },
                    height: { ideal: 1080 }
                },
                audio: false
            };
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = videoStream;
        } catch (err) {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, 
                    audio: false 
                });
                video.srcObject = videoStream;
            } catch (e) {
                alert("카메라 권한을 확인해주세요. (HTTPS 환경 필수)");
            }
        }
    }

    function updateZoom(val) {
        currentZoom = parseFloat(val);
        if (isCaptured) return;
        video.style.transform = `scale(${currentZoom})`;
    }

    // Step 1: 캡처 및 파란색 프로파일 렌더링
    function captureAndFindProfile() {
        if (!isCaptured) {
            const vW = video.videoWidth || 1920;
            const vH = video.videoHeight || 1080;
            
            canvas.width = vW;
            canvas.height = vH;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            // 줌 크롭(Crop) 반영 캡처
            const cropW = vW / currentZoom;
            const cropH = vH / currentZoom;
            const cropX = (vW - cropW) / 2;
            const cropY = (vH - cropH) / 2;

            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, vW, vH);

            video.style.display = 'none';
            canvas.style.display = 'block';
            
            isCaptured = true;
            mainBtn.innerText = "재촬영 (RESET)";
            mainBtn.style.backgroundColor = "#e74c3c";

            statusBadge.innerText = "프로파일 분석 중...";

            setTimeout(() => {
                // 이미지 중앙 부근에 널링 산/골 외곽선을 따라 파란색 프로파일 라인 자동 표기
                drawBlueProfile(vW, vH);
                statusBadge.innerText = "추출 완료 (파란색선 확인)";
                statusBadge.style.backgroundColor = "#27ae60";
            }, 500);

        } else {
            // 초기화 (재촬영)
            canvas.style.display = 'none';
            video.style.display = 'block';
            
            isCaptured = false;
            mainBtn.innerText = "캡처 및 파란색 프로파일 추출";
            mainBtn.style.backgroundColor = "#2980b9";
            statusBadge.innerText = "대기 중 (정렬 후 캡처)";
            statusBadge.style.backgroundColor = "#2980b9";
        }
    }

    // 파란색 프로파일 선을 화면 비율에 맞춰 그리는 함수
    function drawBlueProfile(w, h) {
        const cx = w / 2;
        const cy = h / 2;

        ctx.strokeStyle = '#00d2ff';
        ctx.lineWidth = 8; // 고해상도 기준 두께
        ctx.lineCap = 'round';
        ctx.lineJoin = 'round';
        
        ctx.beginPath();
        // 널링 산 삼각형 윤곽을 따라가는 파란색 외곽선
        ctx.moveTo(cx - 400, cy - 150);
        ctx.lineTo(cx - 240, cy + 180);
        ctx.lineTo(cx - 80, cy - 60);
        ctx.lineTo(cx + 80, cy + 180);
        ctx.lineTo(cx + 240, cy - 60);
        ctx.lineTo(cx + 400, cy - 150);
        ctx.stroke();
    }

    initCamera();
</script>
</body>
</html>
