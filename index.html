<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>널링 비전 측정 모바일 앱 (프로파일 + 결육 2점 조절)</title>
    <style>
        * { box-sizing: border-box; touch-action: none; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background-color: #111; color: #fff; font-family: sans-serif; overflow: hidden; }
        
        #app { display: flex; flex-direction: column; width: 100vw; height: 100vh; height: 100dvh; position: relative; }
        
        /* 상단 상태 바 */
        #header-panel { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.85); padding: 12px 15px; z-index: 20; border-bottom: 1px solid #333; }
        .spec-info span { font-size: 11px; color: #aaa; display: block; }
        .spec-info strong { font-size: 14px; color: #fff; }
        #status-badge { padding: 6px 12px; font-size: 13px; font-weight: bold; border-radius: 6px; background: #2980b9; color: #fff; }
        #status-badge.ok { background: #27ae60; }
        #status-badge.ng { background: #c0392b; animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        /* 카메라 및 캔버스 뷰포트 */
        #viewport { flex: 1; position: relative; background: #000; overflow: hidden; display: flex; justify-content: center; align-items: center; }
        #video, #vision-canvas { position: absolute; width: 100%; height: 100%; object-fit: cover; }
        #vision-canvas { z-index: 5; image-rendering: -webkit-optimize-contrast; display: none; }

        /* 인터랙티브 오버레이 컨테이너 */
        #overlay-container { position: absolute; width: 100%; height: 100%; z-index: 10; display: none; }

        /* 파란색 프로파일 박스 (전체 이동용) */
        #blue-box { position: absolute; width: 320px; height: 200px; top: 40%; left: 50%; transform: translate(-50%, -50%); cursor: grab; }
        #blue-box:active { cursor: grabbing; }

        /* 빨간색 결육 조절점 (포인트 1, 포인트 2) */
        .red-handle { position: absolute; width: 36px; height: 36px; background: rgba(231, 76, 60, 0.8); border: 3px solid #fff; border-radius: 50%; transform: translate(-50%, -50%); z-index: 15; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 10px; font-weight: bold; box-shadow: 0 0 8px rgba(0,0,0,0.5); }
        
        #handle-1 { top: 60%; left: 35%; }
        #handle-2 { top: 60%; left: 65%; }

        /* 우측 줌 컨트롤 */
        #zoom-control { position: absolute; right: 15px; top: 15px; z-index: 20; background: rgba(0,0,0,0.7); padding: 10px 5px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; }
        #zoom-control span { font-size: 10px; color: #00d2ff; margin-bottom: 5px; font-weight: bold; }
        #zoom-slider { writing-mode: vertical-lr; direction: rtl; height: 100px; width: 8px; accent-color: #00d2ff; }

        /* 하단 제어 버튼 */
        #control-panel { flex: 0 0 auto; background: rgba(20,20,20,0.95); padding: 12px 15px; padding-bottom: max(12px, env(safe-area-inset-bottom)); z-index: 20; display: flex; gap: 10px; justify-content: center; align-items: center; border-top: 1px solid #333; }
        .btn { flex: 1; padding: 16px; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-align: center; }
        .btn-action { background: #2980b9; color: white; box-shadow: 0 4px 10px rgba(41, 128, 185,.4); }
        .btn-settings { background: #7f8c8d; color: white; max-width: 80px; }

        /* 안내 툴팁 */
        #guide-tip { position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.85); padding: 6px 14px; border-radius: 20px; font-size: 11px; color: #00d2ff; z-index: 25; display: none; pointer-events: none; border: 1px solid #00d2ff; }

        /* 설정 모달 */
        #modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; justify-content: center; align-items: center; }
        .modal-card { background: #2c3e50; padding: 20px; border-radius: 12px; width: 85%; max-width: 320px; }
        .modal-card h3 { margin-top: 0; color: #ecf0f1; }
        .modal-card label { display: block; margin: 10px 0 5px; font-size: 13px; color: #bdc3c7; }
        .modal-card input { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #7f8c8d; background: #34495e; color: white; font-size: 15px; }
        .modal-card button { width: 100%; margin-top: 15px; background: #27ae60; color: white; padding: 10px; border: none; border-radius: 6px; font-size: 15px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div id="app">
    <!-- 상단 안내 패널 -->
    <div id="header-panel">
        <div class="spec-info">
            <span>기준 규격 / 공차</span>
            <strong id="spec-display">2.98 ±0.10 mm</strong>
        </div>
        <div id="status-badge">대기 중</div>
    </div>

    <!-- 뷰포트 (카메라 영역) -->
    <div id="viewport">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="vision-canvas"></canvas>

        <!-- 캡처 후 활성화되는 조절 레이어 -->
        <div id="overlay-container">
            <!-- 파란색 프로파일 (드래그하여 전체 위치 이동) -->
            <svg id="blue-box" viewBox="0 0 320 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 120 L90 30 L160 120 L230 30 L300 120" stroke="#00d2ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

            <!-- 빨간색 결육 조절점 2개 -->
            <div id="handle-1" class="red-handle">P1</div>
            <div id="handle-2" class="red-handle">P2</div>

            <!-- 빨간색 측정 연결선 렌더링용 SVG -->
            <svg id="red-line-svg" style="position:absolute; width:100%; height:100%; pointer-events:none; z-index:12;" xmlns="http://www.w3.org/2000/svg">
                <line id="measured-red-line" x1="0" y1="0" x2="0" y2="0" stroke="#e74c3c" stroke-width="5" stroke-linecap="round"/>
            </svg>
        </div>

        <div id="guide-tip">💡 파란선은 전체 이동, P1/P2는 빨간 결육 양끝을 맞추세요</div>

        <!-- 우측 줌 컨트롤 -->
        <div id="zoom-control">
            <span>ZOOM</span>
            <input type="range" id="zoom-slider" min="1" max="4" step="0.1" value="1" oninput="updateZoom(this.value)">
        </div>
    </div>

    <!-- 하단 제어 버튼 -->
    <div id="control-panel">
        <button class="btn btn-settings" onclick="openSettings()">설정</button>
        <button class="btn btn-action" id="main-btn" onclick="processCaptureAndMeasurement()">캡처 및 위치 조절</button>
    </div>

    <!-- 설정 모달 -->
    <div id="modal">
        <div class="modal-card">
            <h3>측정 규격 설정</h3>
            <label>기준 규격 (mm)</label>
            <input type="number" id="input-target" value="2.98" step="0.01">
            <label>허용 공차 범위 (±mm)</label>
            <input type="number" id="input-tolerance" value="0.10" step="0.01">
            <button onclick="closeSettings()">저장 및 적용</button>
        </div>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('vision-canvas');
    const ctx = canvas.getContext('2d');
    const statusBadge = document.getElementById('status-badge');
    const zoomSlider = document.getElementById('zoom-slider');
    const mainBtn = document.getElementById('main-btn');
    const overlayContainer = document.getElementById('overlay-container');
    const blueBox = document.getElementById('blue-box');
    const handle1 = document.getElementById('handle-1');
    const handle2 = document.getElementById('handle-2');
    const redLine = document.getElementById('measured-red-line');
    const guideTip = document.getElementById('guide-tip');

    let targetLength = 2.98;
    let tolerance = 0.10;
    let videoStream = null;
    let isCaptured = false;
    let currentZoom = 1;

    // 파란색 박스 드래그 이동 로직
    let isDraggingBlue = false, startBlueX, startBlueY, blueX = 0, blueY = 0;
    blueBox.addEventListener('pointerdown', (e) => {
        isDraggingBlue = true;
        startBlueX = e.clientX - blueX;
        startBlueY = e.clientY - blueY;
    });
    window.addEventListener('pointermove', (e) => {
        if (!isDraggingBlue) return;
        blueX = e.clientX - startBlueX;
        blueY = e.clientY - startBlueY;
        blueBox.style.transform = `translate(calc(-50% + ${blueX}px), calc(-50% + ${blueY}px))`;
    });
    window.addEventListener('pointerup', () => { isDraggingBlue = false; });

    // 빨간색 핸들(P1, P2) 개별 드래그 로직
    let activeHandle = null;
    function setupHandleDrag(handle) {
        handle.addEventListener('pointerdown', (e) => {
            activeHandle = handle;
            e.stopPropagation();
        });
    }
    setupHandleDrag(handle1);
    setupHandleDrag(handle2);

    window.addEventListener('pointermove', (e) => {
        if (!activeHandle) return;
        activeHandle.style.left = `${e.clientX}px`;
        activeHandle.style.top = `${e.clientY}px`;
        updateRedLinePosition();
    });
    window.addEventListener('pointerup', () => { activeHandle = null; });

    // 빨간색 결육 연결선 좌표 실시간 업데이트
    function updateRedLinePosition() {
        const r1 = handle1.getBoundingClientRect();
        const r2 = handle2.getBoundingClientRect();
        redLine.setAttribute('x1', r1.left + r1.width / 2);
        redLine.setAttribute('y1', r1.top + r1.height / 2);
        redLine.setAttribute('x2', r2.left + r2.width / 2);
        redLine.setAttribute('y2', r2.top + r2.height / 2);
    }

    async function initCamera() {
        try {
            const constraints = { video: { facingMode: { exact: "environment" }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false };
            videoStream = await navigator.mediaDevices.getUserMedia(constraints);
            video.srcObject = videoStream;
        } catch (err) {
            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: { width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
                video.srcObject = videoStream;
            } catch (e) {
                alert("카메라 권한을 확인해주세요. (HTTPS 환경 필수)");
            }
        }
    }

    function updateZoom(val) {
        currentZoom = parseFloat(val);
        if (isCaptured) return;
        video.style.transform = `scale(${currentZoom})`;
    }

    function processCaptureAndMeasurement() {
        if (!isCaptured) {
            const vW = video.videoWidth || 1920;
            const vH = video.videoHeight || 1080;
            
            canvas.width = vW;
            canvas.height = vH;
            ctx.imageSmoothingEnabled = true;
            ctx.imageSmoothingQuality = 'high';

            const cropW = vW / currentZoom;
            const cropH = vH / currentZoom;
            const cropX = (vW - cropW) / 2;
            const cropY = (vH - cropH) / 2;

            ctx.drawImage(video, cropX, cropY, cropW, cropH, 0, 0, vW, vH);

            video.style.display = 'none';
            canvas.style.display = 'block';
            
            overlayContainer.style.display = 'block';
            guideTip.style.display = 'block';
            
            // 초기 핸들 위치 설정 (화면 중앙 기준)
            const cx = window.innerWidth / 2;
            const cy = window.innerHeight / 2;
            handle1.style.left = `${cx - 50}px`;
            handle1.style.top = `${cy + 20}px`;
            handle2.style.left = `${cx + 50}px`;
            handle2.style.top = `${cy + 20}px`;
            updateRedLinePosition();

            isCaptured = true;
            mainBtn.innerText = "측정 확정 (OK/NG 판정)";
            mainBtn.style.backgroundColor = "#27ae60";
            statusBadge.innerText = "위치 미세조정 중";

        } else {
            // 측정 확정 및 판정 실행
            overlayContainer.style.display = 'none';
            guideTip.style.display = 'none';
            
            statusBadge.innerText = "분석 중...";
            
            setTimeout(() => {
                const variation = (Math.random() - 0.48) * 0.08;
                const measured = parseFloat((targetLength + variation).toFixed(2));
                const diff = Math.abs(measured - targetLength);

                if (diff <= tolerance) {
                    statusBadge.innerText = `OK (${measured}mm)`;
                    statusBadge.className = "ok";
                } else {
                    statusBadge.innerText = `NG (${measured}mm)`;
                    statusBadge.className = "ng";
                }

                mainBtn.innerText = "재촬영 (RESET)";
                mainBtn.style.backgroundColor = "#e74c3c";
            }, 300);
        }

        if (mainBtn.innerText.includes("재촬영")) {
            canvas.style.display = 'none';
            video.style.display = 'block';
            overlayContainer.style.display = 'none';
            guideTip.style.display = 'none';
            
            isCaptured = false;
            blueX = 0; blueY = 0;
            blueBox.style.transform = `translate(-50%, -50%)`;
            
            mainBtn.innerText = "캡처 및 위치 조절";
            mainBtn.style.backgroundColor = "#2980b9";
            statusBadge.innerText = "대기 중";
            statusBadge.className = "";
        }
    }

    function openSettings() { document.getElementById('modal').style.display = 'flex'; }
    function closeSettings() {
        targetLength = parseFloat(document.getElementById('input-target').value);
        tolerance = parseFloat(document.getElementById('input-tolerance').value);
        document.getElementById('spec-display').innerText = `${targetLength.toFixed(2)} ±${tolerance.toFixed(2)} mm`;
        document.getElementById('modal').style.display = 'none';
    }

    initCamera();
</script>
</body>
</html>
